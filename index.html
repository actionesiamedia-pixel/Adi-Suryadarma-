<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adi Suryadarma — Cover Generator</title><style>:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#292724;background:#f4f2ee}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1120px;margin:auto;padding:32px 18px}h1{font-size:clamp(25px,4vw,38px);margin:0 0 8px}.intro{color:#706a64;margin:0 0 24px}.layout{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px}.panel,.preview{background:white;border:1px solid #e2ddd6;border-radius:16px;padding:20px}label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}input,select,textarea{width:100%;padding:11px;border:1px solid #cfc8bf;border-radius:8px;font:inherit;background:white;color:#292724}textarea{resize:vertical;min-height:85px}.field{margin-bottom:17px}.small{font-size:12px;color:#706a64;margin:6px 0 0}.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}.swatch{width:29px;height:29px;border:2px solid white;border-radius:50%;box-shadow:0 0 0 1px #b9b2aa;cursor:pointer}.swatch.active{box-shadow:0 0 0 2px #a14c38}canvas{display:block;width:100%;height:auto;aspect-ratio:1200/630;border-radius:8px;border:1px solid #e5dfd6}button.download{background:#292724;color:white;border:0;border-radius:9px;padding:13px 20px;font-weight:700;cursor:pointer;width:100%;margin-top:18px}.foot{font-size:12px;color:#777;margin-top:14px}@media(max-width:790px){.layout{grid-template-columns:1fr}.preview{padding:12px}}</style></head><body><main class="wrap"><h1>Adi Suryadarma Cover Generator</h1><p class="intro">Featured image bergaya majalah personal • 1200 × 630 px</p><div class="layout"><section class="panel"><div class="field"><label for="category">Kategori</label><select id="category"><option>Hidup</option><option>Kerja</option><option>Uang</option><option>Cerita</option></select></div><div class="field"><label>Warna latar</label><div class="swatches" id="swatches"></div><input type="color" id="color" value="#f4f1e9" aria-label="Pilih warna custom"></div><div class="field"><label for="pattern">Pattern</label><select id="pattern"><option value="none">Tanpa pattern</option><option value="dots">Titik halus</option><option value="lines">Garis diagonal</option><option value="grid">Grid tipis</option><option value="circles">Lingkaran editorial</option><option value="corners">Sudut geometris</option></select></div><div class="field"><label for="headline">Judul utama</label><textarea id="headline" maxlength="170">Kenapa Kita Suka Membandingkan Hidup?</textarea></div><div class="field"><label for="subtitle">Subjudul (opsional)</label><textarea id="subtitle" maxlength="210">Kadang yang membuat kita lelah bukan kehidupan sendiri, melainkan kehidupan orang lain yang terus kita perhatikan.</textarea><p class="small">Diletakkan tepat di bawah judul utama.</p></div><button class="download" id="download">Download PNG</button><p class="foot">Watermark adisuryadarma.com otomatis. Semua gambar diproses di perangkatmu.</p></section><section class="preview"><canvas id="canvas" width="1200" height="630" aria-label="Preview featured image"></canvas><p class="small">Preview akan berubah otomatis saat pengaturan diubah.</p></section></div></main><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');const $=id=>document.getElementById(id);const palette=['#f4f1e9','#ede5d6','#f0d8c1','#e4e9e4','#dce5e7','#292f38','#324c48','#463d49','#e9d9dc','#f5e4c6'];let color=$('color').value;
function lum(hex){const v=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(v=>v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2.4));return .2126*v[0]+.7152*v[1]+.0722*v[2]}
function rgba(hex,a){const v=hex.slice(1).match(/../g).map(x=>parseInt(x,16));return `rgba(${v.join(',')},${a})`}
function wrap(text,maxWidth,font){ctx.font=font;const lines=[];for(const para of text.trim().split(/\n/)){let line='';for(const word of para.split(/\s+/).filter(Boolean)){const candidate=line?line+' '+word:word;if(ctx.measureText(candidate).width>maxWidth&&line){lines.push(line);line=word}else line=candidate}if(line)lines.push(line)}return lines}
function fit(text,width,maxLines,maxSize,minSize,weight,family){for(let size=maxSize;size>=minSize;size--){const font=`${weight} ${size}px ${family}`,lines=wrap(text,width,font);if(lines.length<=maxLines&&lines.every(s=>{ctx.font=font;return ctx.measureText(s).width<=width}))return {size,lines,font}}const font=`${weight} ${minSize}px ${family}`;return {size:minSize,lines:wrap(text,width,font),font}}
function pattern(type,ink){ctx.save();ctx.strokeStyle=rgba(ink,.085);ctx.fillStyle=rgba(ink,.09);ctx.lineWidth=1.4;if(type==='dots')for(let y=40;y<630;y+=27)for(let x=35;x<1200;x+=27){ctx.beginPath();ctx.arc(x,y,1.5,0,Math.PI*2);ctx.fill()}if(type==='lines')for(let x=-650;x<1400;x+=38){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+650,650);ctx.stroke()}if(type==='grid'){for(let x=0;x<1200;x+=58){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,630);ctx.stroke()}for(let y=0;y<630;y+=58){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(1200,y);ctx.stroke()}}if(type==='circles')for(let r=90;r<=500;r+=50){ctx.beginPath();ctx.arc(1100,90,r,0,Math.PI*2);ctx.stroke()}if(type==='corners'){ctx.lineWidth=18;ctx.strokeRect(1010,-105,300,300);ctx.strokeRect(-150,490,270,270)}ctx.restore()}
function draw(){const bg=color, dark=lum(bg)<.27,ink=dark?'#faf7f0':'#262626',muted=dark?'#d5d0c9':'#68645e',accent=dark?'#e6b29c':'#a14c38';ctx.fillStyle=bg;ctx.fillRect(0,0,1200,630);pattern($('pattern').value,ink);ctx.fillStyle=accent;ctx.font='700 23px system-ui,sans-serif';ctx.fillText($('category').value.toUpperCase(),175,124);const title=$('headline').value.trim()||'Judul artikel';const sub=$('subtitle').value.trim();let best;for(let max=73;max>=36;max--){const h=fit(title,850,4,max,36,'700','Georgia,serif');const s=sub?fit(sub,850,3,30,20,'400','system-ui,sans-serif'):null;const th=h.lines.length*h.size*1.14,sh=s?s.lines.length*s.size*1.43:0,gap=sub?24:0;if(th+sh+gap<=355){best={h,s,th,sh,gap};break}}if(!best){const h=fit(title,850,6,36,32,'700','Georgia,serif'),s=sub?fit(sub,850,3,20,18,'400','system-ui,sans-serif'):null;best={h,s,th:h.lines.length*h.size*1.1,sh:s?s.lines.length*s.size*1.3:0,gap:15}}let y=157+Math.max(0,(355-best.th-best.sh-best.gap)/2);ctx.fillStyle=ink;ctx.font=best.h.font;for(const line of best.h.lines){ctx.fillText(line,175,y+best.h.size);y+=best.h.size*1.14}if(best.s){y+=best.gap;ctx.fillStyle=muted;ctx.font=best.s.font;for(const line of best.s.lines){ctx.fillText(line,175,y+best.s.size);y+=best.s.size*1.43}}ctx.strokeStyle=accent;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(175,555);ctx.lineTo(217,555);ctx.stroke();ctx.fillStyle=muted;ctx.textAlign='left';ctx.font='19px system-ui,sans-serif';ctx.fillText('adisuryadarma.com',175,590);ctx.textAlign='left'}
const sw=$('swatches');palette.forEach(hex=>{const b=document.createElement('button');b.className='swatch'+(hex===color?' active':'');b.style.background=hex;b.title=hex;b.type='button';b.addEventListener('click',()=>{color=hex;$('color').value=hex;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));b.classList.add('active');draw()});sw.appendChild(b)});['category','pattern','headline','subtitle'].forEach(id=>$(id).addEventListener('input',draw));$('color').addEventListener('input',e=>{color=e.target.value;document.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));draw()});$('download').addEventListener('click',()=>{draw();const a=document.createElement('a');a.download='adi-suryadarma-'+$('category').value.toLowerCase()+'-cover.png';a.href=canvas.toDataURL('image/png');a.click()});draw();
</script></body></html>
